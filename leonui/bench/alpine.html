<!doctype html><html lang="en"><head><meta charset="utf-8"><title>bench — alpine</title>
<style>.row{display:flex}.label{flex:1}.row.done .label{text-decoration:line-through}</style></head>
<body>
<div x-data="bench"><ul id="bench-list">
  <template x-for="r in rows" :key="r.id">
    <li :class="r.done ? 'row done' : 'row'"><span class="label" x-text="r.label"></span></li>
  </template>
</ul></div>
<script type="module" src="/bench/vendor/alpine-app.js"></script>
<script type="module">
  const settle = () => new Promise(r => requestAnimationFrame(() => requestAnimationFrame(r)));
  window.__bench = {
    async mount() { window.Alpine.start(); },
    async create(n) {
      const c = window.Alpine.$data(document.querySelector('[x-data]'));
      const start = c.rows.length;
      const made = Array.from({ length: n }, (_, i) => ({ id: start + i + 1, label: 'item #' + (start + i + 1), done: false }));
      c.rows = [...c.rows, ...made];
    },
    async update() {
      const c = window.Alpine.$data(document.querySelector('[x-data]'));
      c.rows = c.rows.map(r => (r.id % 10 === 0 ? { ...r, done: !r.done } : r));
    },
    async remove() {
      const c = window.Alpine.$data(document.querySelector('[x-data]'));
      c.rows = [];
    },
    async replace() { await window.__bench.remove(); await window.__bench.create(1000); },
    rows: () => document.querySelectorAll('#bench-list li.row').length,
    doneCount: () => document.querySelectorAll('#bench-list li.row.done').length,
  };
  await window.__bench.mount();
  await settle();
  window.__benchReadyAt = performance.now();
</script>
</body></html>
