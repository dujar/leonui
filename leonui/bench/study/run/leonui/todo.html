<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Todo</title>
<link rel="stylesheet" href="/src/ui.css">
<style>
  body { max-width: 560px; margin: 0 auto; padding: 1.25rem; font-size: 15px; }
  .is-done { text-decoration-line: line-through; }
</style>
</head>
<body ui:state="draft: ''; items: []; nextId: 1; left: 0">

  <h1>Todo</h1>

  <div ui:row gap="2">
    <input id="new-todo" ui:input type="text" ui:model="draft" placeholder="What needs doing?" style="flex:1">
    <button id="add-btn" ui:button variant="primary"
            ui:fx="click: set items = draft == '' ? items : [ ...items, { id: nextId, title: draft, done: false } ];
                   set left = draft == '' ? left : left + 1;
                   set nextId = nextId + 1;
                   set draft = ''">Add</button>
  </div>

  <p id="status" ui:bind="text: left + ' left'">0 left</p>

  <ul id="todo-list" style="list-style:none;padding:0;margin:12px 0 0">
    <li ui:each="item in items" ui:key="id" ui:row gap="2" align="center">
      <input type="checkbox" ui:checkbox ui:bind-checked="item.done" aria-label="mark done"
             ui:fx="change: set item.done = !item.done; set left = item.done ? left - 1 : left + 1">
      <span ui:bind="text: item.title" ui:bind-class="item.done ? 'is-done' : ''" style="flex:1"></span>
      <button ui:button
              ui:fx="click: set items = without(items, item); set left = item.done ? left : left - 1">Remove</button>
    </li>
  </ul>

<script type="module" src="/dist/leonui.js"></script>
</body>
</html>
