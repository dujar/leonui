<!doctype html><html lang="en"><head><meta charset="utf-8"><title>selftest tabs — leonui</title><link rel="stylesheet" href="/src/ui.css"></head>
<body ui:state="tab: 'overview'">
  <h1>Plans</h1>
  <div role="tablist">
    <button role="tab" ui:fx="click: set tab = 'overview'" ui:bind-attr:aria-selected="tab == 'overview' ? 'true' : 'false'">Overview</button>
    <button role="tab" ui:fx="click: set tab = 'details'" ui:bind-attr:aria-selected="tab == 'details' ? 'true' : 'false'">Details</button>
    <button role="tab" ui:fx="click: set tab = 'pricing'" ui:bind-attr:aria-selected="tab == 'pricing' ? 'true' : 'false'">Pricing</button>
  </div>
  <section role="tabpanel" ui:bind-hidden="tab != 'overview'">The starter plan includes every core feature.</section>
  <section role="tabpanel" ui:bind-hidden="tab != 'details'">Billing is monthly and you can cancel anytime.</section>
  <section role="tabpanel" ui:bind-hidden="tab != 'pricing'">The starter plan costs nine dollars per month.</section>
  <script type="module" src="/dist/leonui.js"></script>
</body></html>
