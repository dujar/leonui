<!doctype html><html><head><title>stat-tile component</title><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><link rel="stylesheet" href="/src/ui.css"></head>
<body>
<template id="stat-tile">
  <div class="ui-card" ui:state="n: 0" style="min-width:9rem">
    <span class="ui-badge ui-b-success" ui:bind="text: label"></span>
    <p style="margin:.4rem 0"><b ui:bind="text: n + start"></b></p>
    <div ui:row gap="2">
      <button ui:button ui:fx="click: set n = n + 1">+1</button>
      <button ui:button ui:fx="click: set n = 0">reset</button>
    </div>
  </div>
</template>
</body></html>
