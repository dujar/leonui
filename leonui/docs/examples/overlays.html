<!doctype html><html lang="en"><head><title>overlays</title><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><link rel="stylesheet" href="/src/ui.css"><style>body{padding:1.25rem;font-size:15px}</style></head>
<body>
  <div ui:row gap="3">
    <button id="menu-btn" ui:button popovertarget="menu">Open menu</button>
    <div id="menu" popover ui:popover anchor="#menu-btn" placement="bottom-start">
      <button class="ui-menu-item" ui:fx="click: toast 'hello from the menu'">Say hello</button>
    </div>
    <button ui:button variant="primary" command="show-modal" commandfor="dlg">Open modal</button>
  </div>
  <dialog id="dlg" ui:modal>
    <h3 class="ui-t-subtitle">Zero-JS modal</h3>
    <p class="ui-t-muted">Opened with <code>command="show-modal"</code> — a platform invoker.</p>
    <button ui:button command="close" commandfor="dlg">Close</button>
  </dialog>
<script type="module" src="/dist/leonui.js"></script>
</body></html>
