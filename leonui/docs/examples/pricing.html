<!doctype html><html lang="en"><head><title>pricing table</title><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><link rel="stylesheet" href="/src/ui.css"><style>
  body { padding: 1.5rem 1.25rem; font-size: 15px; max-width: 60rem; }
  .billing { display: flex; align-items: center; gap: .6rem; margin: 1rem 0; }
  .billing label { display: flex; align-items: center; gap: .5rem; cursor: pointer; }
  .tiers { display: grid; gap: .8rem; }
  @media (min-width: 40rem) { .tiers { grid-template-columns: repeat(3, 1fr); } }
  .tier { display: flex; flex-direction: column; gap: .6rem; }
  .tier > button { margin-top: auto; }
  .tier-featured { border-color: var(--brand); box-shadow: 0 0 0 1px var(--brand); }
  .head { display: flex; align-items: center; justify-content: space-between; gap: .5rem; font-weight: 600; }
  .price { font-size: 1.9rem; font-weight: 700; letter-spacing: -.02em; font-variant-numeric: tabular-nums; }
  .price small { font-size: .75rem; font-weight: 500; color: var(--muted); letter-spacing: 0; }
  ul { list-style: none; margin: 0; padding: 0; display: grid; gap: .45rem; font-size: .875rem; color: var(--muted); }
  li { display: flex; gap: .45rem; align-items: flex-start; }
  li svg { flex: 0 0 auto; margin-top: .2rem; color: var(--brand); }
</style></head>
<body ui:state="annual: false" ui:computed="proPrice: annual ? 24 : 29">

  <!-- A checkbox is a boolean, and `ui:model` writes the STRING `.value` — for a
       checkbox that is always "on". The documented pattern is `ui:bind-checked`
       (signal → DOM) plus a `toggle` verb (DOM → signal), which is what this is. -->
  <div class="billing">
    <label>
      <input type="checkbox" ui:checkbox ui:bind-checked="annual" ui:fx="change: toggle annual">
      <span>Bill annually</span>
    </label>
    <span class="ui-badge ui-b-brand" ui:bind-hidden="!annual">2 months free</span>
  </div>

  <!-- `ui:computed` takes ONE declaration per element, so the second price gets
       its own element. Both read the same `annual` signal. -->
  <div class="tiers" ui:computed="bizPrice: annual ? 64 : 79">
    <div class="ui-card tier" ui:reveal stagger="0">
      <div class="head"><span>Solo</span></div>
      <p class="price">£0<small>/month</small></p>
      <p class="ui-t-muted">Up to 3 clients.</p>
      <ul>
        <li><svg ui:icon name="check"></svg>Unlimited invoices</li>
        <li><svg ui:icon name="check"></svg>Payment links</li>
      </ul>
      <button ui:button block ui:fx="click: toast 'Solo plan selected'">Start free</button>
    </div>

    <div class="ui-card tier tier-featured" ui:reveal stagger="1">
      <div class="head"><span>Pro</span><span class="ui-badge ui-b-brand">Popular</span></div>
      <p class="price">£<span ui:bind="text: proPrice"></span><small>/month</small></p>
      <p class="ui-t-muted">Unlimited clients and the forecast.</p>
      <ul>
        <li><svg ui:icon name="check"></svg>Everything in Solo</li>
        <li><svg ui:icon name="check"></svg>Late-fee rules</li>
        <li><svg ui:icon name="check"></svg>Cash-flow forecast</li>
      </ul>
      <button ui:button variant="primary" block ui:fx="click: toast 'Pro trial started'">Start 14-day trial</button>
    </div>

    <div class="ui-card tier" ui:reveal stagger="2">
      <div class="head"><span>Studio</span></div>
      <p class="price">£<span ui:bind="text: bizPrice"></span><small>/month</small></p>
      <p class="ui-t-muted">For 2–10 people.</p>
      <ul>
        <li><svg ui:icon name="check"></svg>Everything in Pro</li>
        <li><svg ui:icon name="check"></svg>Up to 10 seats</li>
      </ul>
      <button ui:button block ui:fx="click: toast 'Studio trial started'">Start 14-day trial</button>
    </div>
  </div>
<script type="module" src="/dist/leonui.js"></script>
</body></html>
