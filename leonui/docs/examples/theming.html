<!doctype html><html lang="en"><head><title>theming</title><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><link rel="stylesheet" href="/src/ui.css"><style>body{padding:1.25rem;font-size:15px}</style></head>
<body style="--brand: #6d28d9; --r: 4px">
  <p>This example overrides two tokens on its body: <code>--brand</code> and <code>--r</code>.</p>
  <p ui:row gap="2">
    <span class="ui-badge ui-b-brand">brand badge</span>
    <span class="ui-badge ui-b-success">success</span>
    <span class="ui-badge ui-b-danger">danger</span>
  </p>
  <button class="ui-btn ui-btn-primary" ui:fx="click: toast 'themed!'">Themed primary button</button>
  <div style="color-scheme: dark; background: #14161a; color: #e8eaed; padding: 12px; border-radius: 8px; margin-top: 12px">
    Same tokens inside <code>color-scheme: dark</code> — light-dark() flips, no JS:
    <p ui:row gap="2" style="margin:8px 0 0">
      <span class="ui-badge ui-b-brand">brand badge</span>
      <span class="ui-badge ui-b-success">success</span>
    </p>
  </div>
<script type="module" src="/dist/leonui.js"></script>
</body></html>
