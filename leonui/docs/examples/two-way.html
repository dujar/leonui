<!doctype html><html lang="en"><head><title>two-way</title><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><link rel="stylesheet" href="/src/ui.css"><style>body{padding:1.25rem;font-size:15px}</style></head>
<body ui:state="name: ''; flavor: 'mint'">
  <div class="ui-field" ui:field>
    <label for="n">Your name</label>
    <input id="n" ui:input type="text" ui:model="name" placeholder="type…">
  </div>
  <div class="ui-field" ui:field>
    <label for="f">Flavor</label>
    <select id="f" ui:select ui:model="flavor">
      <option value="mint">mint</option>
      <option value="mango">mango</option>
      <option value="coffee">coffee</option>
    </select>
  </div>
  <p ui:bind="text: name == '' ? 'Hello, stranger!' : 'Hello, ' + name + '! Have some ' + flavor + '.'"></p>
<script type="module" src="/dist/leonui.js"></script>
</body></html>
