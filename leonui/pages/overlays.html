<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Overlays — leonui</title><link rel="stylesheet" href="/src/ui.css"></head>
<body ui:state="note: ''; gate: 'closed'">
  <h1 class="ui-t-title">Overlays</h1>

  <h2 class="ui-t-subtitle">Popover — anchored, placements (platform popover + anchor positioning)</h2>
  <div ui:row gap="4">
    <button id="pop1-btn" ui:button popovertarget="pop1">Open bottom-end</button>
    <div id="pop1" popover ui:popover anchor="#pop1-btn" placement="bottom-end">
      <button class="ui-menu-item" id="pop1-item" ui:fx="click: set gate = 'from-popover'">Set gate from popover</button>
    </div>
    <button id="pop2-btn" ui:button popovertarget="pop2">Open top-start</button>
    <div id="pop2" popover ui:popover anchor="#pop2-btn" placement="top-start">
      <span id="pop2-body">top popover</span>
    </div>
  </div>
  <p id="echo-gate" ui:bind="text: 'gate = ' + gate"></p>

  <h2 class="ui-t-subtitle">Menu (popover + platform invokers)</h2>
  <button id="menu-btn" ui:button variant="ghost" popovertarget="menu1"><svg ui:icon name="menu"></svg> Menu</button>
  <div id="menu1" popover ui:popover anchor="#menu-btn" placement="bottom-start">
    <button class="ui-menu-item" ui:fx="click: toast 'item one'">Item one</button>
    <button class="ui-menu-item" ui:fx="click: toast 'item two'">Item two</button>
  </div>

  <h2 class="ui-t-subtitle">Modal — &lt;dialog&gt; + invoker commands, zero JS</h2>
  <button id="dlg-open" ui:button variant="primary" command="show-modal" commandfor="dlg1">Open modal</button>
  <dialog id="dlg1" ui:modal>
    <h3 class="ui-t-subtitle" id="dlg-title">Modal title</h3>
    <p class="ui-t-muted">Platform dialog, styled by the framework.</p>
    <button id="dlg-close" ui:button command="close" commandfor="dlg1">Close</button>
  </dialog>

  <h2 class="ui-t-subtitle">Toasts — normal + fail</h2>
  <div ui:row gap="3">
    <button id="toast-ok" ui:button ui:fx="click: toast 'saved!'">Toast ok</button>
    <button id="toast-fail" ui:button ui:fx="click: toast 'failed!' ; onfail: toast 'unused'">Toast plain</button>
    <button id="toast-fail2" ui:button
            ui:fx="click: call DELETE /api/tasks/999 ; onfail: toast 'delete failed'">
      Call fail → onfail toast
    </button>
  </div>

  <h2 class="ui-t-subtitle">Prompt + confirm + delay</h2>
  <div ui:row gap="3">
    <button id="ask-btn" ui:button ui:fx="click: prompt 'Your note?' into note">Ask note</button>
    <button id="confirm-btn" ui:button ui:fx="click: confirm 'Sure?'; set gate = 'confirmed'">Confirm gate</button>
    <button id="delay-btn" ui:button ui:fx="click: delay 300; set gate = 'delayed'">Delay 300ms</button>
  </div>
  <p id="echo-note" ui:bind="text: note == '' ? '(no note)' : 'note = ' + note"></p>
  <p id="echo-gate2" ui:bind="text: 'gate2 = ' + gate"></p>

<script type="module" src="/dist/leonui.js"></script>
</body>
</html>
