<!doctype html><html lang="en"><head><title>keyed list</title><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><link rel="stylesheet" href="/src/ui.css"><style>body{padding:1.25rem;font-size:15px}</style></head>
<body ui:state="draft: ''; nextId: 1; todos: [ { id: 0, t: 'read the docs' } ]">
  <div ui:row gap="2">
    <input id="td" ui:input type="text" ui:model="draft" placeholder="new todo…" style="flex:1">
    <button ui:button variant="primary" ui:bind="disabled: draft == ''"
            ui:fx="click: set todos = [ { id: nextId, t: draft }, ...todos ]; set nextId = nextId + 1; set draft = ''">Add</button>
  </div>
  <ul class="ui-list" style="margin-top:12px">
    <li ui:each="td in todos" ui:key="id" class="ui-list-item">
      <span class="ui-list-title" style="flex:1" ui:bind="text: td.t"></span>
      <button class="ui-btn ui-btn-icon" aria-label="remove"
              ui:fx="click: set todos = without(todos, td)"><svg ui:icon name="x"></svg></button>
    </li>
  </ul>
  <p class="ui-state" ui:bind="hidden: todos.length != 0">nothing here</p>
<script type="module" src="/dist/leonxstream.js"></script>
</body></html>
